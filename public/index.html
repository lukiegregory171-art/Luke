<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rivals-Style FPS</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🎯</text></svg>" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
  #game-canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  #hud { position: fixed; inset: 0; pointer-events: none; }

  /* Crosshair */
  #crosshair { --spread: 6px; position: absolute; top: 50%; left: 50%; width: 0; height: 0; }
  #crosshair span { position: absolute; background: #eaf3ea; box-shadow: 0 0 2px rgba(0,0,0,0.8); }
  #crosshair .h { width: 14px; height: 2px; top: -1px; }
  #crosshair .v { width: 2px; height: 14px; left: -1px; }
  #crosshair .top { transform: translate(-1px, calc(-10px - var(--spread))); }
  #crosshair .bottom { transform: translate(-1px, calc(10px + var(--spread) - 14px)); }
  #crosshair .left { transform: translate(calc(-10px - var(--spread)), -1px); }
  #crosshair .right { transform: translate(calc(10px + var(--spread) - 14px), -1px); }

  #hit-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff4d4d; font-size: 26px; font-weight: bold; opacity: 0; transition: opacity 0.1s; text-shadow: 0 0 4px #000; }

  #damage-flash { position: absolute; inset: 0; background: radial-gradient(circle, transparent 40%, #c40000 140%); opacity: 0; transition: opacity 0.1s; }

  /* Bottom-left: health */
  #health-panel { position: absolute; left: 24px; bottom: 24px; width: 220px; }
  #health-bar { width: 100%; height: 22px; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.25); border-radius: 4px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #4caf50; transition: width 0.15s, background 0.15s; }
  #health-text { position: absolute; right: 8px; top: 1px; color: #fff; font-weight: bold; font-size: 14px; text-shadow: 0 0 3px #000; }
  #dash-bar { margin-top: 6px; width: 100%; height: 8px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
  #dash-fill { height: 100%; width: 100%; background: #4dd0e1; transition: width 0.1s linear; }
  #dash-label { color: #cfe; font-size: 11px; letter-spacing: 1px; margin-top: 2px; }

  /* Bottom-right: weapon/ammo */
  #weapon-panel { position: absolute; right: 24px; bottom: 24px; text-align: right; color: #fff; text-shadow: 0 0 3px #000; }
  #weapon-name { font-size: 16px; letter-spacing: 1px; opacity: 0.85; }
  #ammo-text { font-size: 34px; font-weight: bold; }
  #reload-text { font-size: 13px; color: #ffcf5c; display: none; }

  /* Top-center: score banner */
  #score-banner { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; color: #fff; font-weight: bold; font-size: 22px; text-shadow: 0 0 4px #000; background: rgba(0,0,0,0.35); padding: 6px 18px; border-radius: 6px; }
  #score-red { color: #ff6b5e; } #score-blue { color: #5eaaff; }

  /* Top-left: kill feed */
  #kill-feed { position: absolute; top: 70px; right: 24px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .kill-row { background: rgba(0,0,0,0.45); color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 13px; display: flex; gap: 8px; }
  .kill-weapon { color: #ccc; }

  #respawn-overlay, #match-over-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; color: #fff; font-size: 26px; font-weight: bold; text-align: center; }

  #scoreboard { position: absolute; inset: 0; background: rgba(10,12,16,0.85); display: none; align-items: flex-start; justify-content: center; gap: 60px; padding-top: 90px; color: #fff; }
  .scoreboard-col { min-width: 260px; }
  .scoreboard-col h3 { margin: 0 0 10px; font-size: 18px; letter-spacing: 1px; }
  .scoreboard-row { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 14px; background: rgba(255,255,255,0.06); margin-bottom: 2px; border-radius: 3px; }

  #menu-overlay { position: fixed; inset: 0; background: linear-gradient(160deg,#1c2430,#0c1016); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; z-index: 20; }
  #menu-overlay h1 { font-size: 42px; letter-spacing: 2px; margin-bottom: 4px; }
  #menu-overlay p.sub { color: #9db0c0; margin-top: 0; margin-bottom: 28px; }
  #name-input { font-size: 16px; padding: 10px 14px; border-radius: 4px; border: none; width: 240px; text-align: center; margin-bottom: 14px; }
  #join-btn { font-size: 18px; padding: 12px 34px; border-radius: 4px; border: none; background: #e0533f; color: #fff; font-weight: bold; cursor: pointer; letter-spacing: 1px; }
  #join-btn:hover { background: #f0654f; }
  #menu-help { margin-top: 26px; color: #6f8496; font-size: 13px; max-width: 420px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div id="crosshair"><span class="h top"></span><span class="h bottom"></span><span class="v left"></span><span class="v right"></span></div>
    <div id="hit-marker">✕</div>
    <div id="damage-flash"></div>

    <div id="health-panel">
      <div id="health-bar"><div id="health-fill"></div><span id="health-text">100</span></div>
      <div id="dash-bar"><div id="dash-fill"></div></div>
      <div id="dash-label">DASH</div>
    </div>

    <div id="weapon-panel">
      <div id="weapon-name">Assault Rifle</div>
      <div id="ammo-text">30 / 30</div>
      <div id="reload-text">RELOADING…</div>
    </div>

    <div id="score-banner"><span id="score-red">0</span><span>—</span><span id="score-blue">0</span></div>

    <div id="kill-feed"></div>

    <div id="respawn-overlay"><div id="respawn-text">Respawning…</div></div>
    <div id="match-over-overlay"><div id="match-over-text"></div></div>

    <div id="scoreboard">
      <div class="scoreboard-col" id="scoreboard-red"></div>
      <div class="scoreboard-col" id="scoreboard-blue"></div>
    </div>
  </div>

  <div id="menu-overlay">
    <h1>RIVALS-STYLE FPS</h1>
    <p class="sub">Team Deathmatch · First to 25 kills</p>
    <input id="name-input" maxlength="16" placeholder="Your name" />
    <button id="join-btn">CLICK TO JOIN</button>
    <div id="menu-help">
      WASD move · Mouse look · Shift dash · Space jump (double-jump in air)<br />
      1-4 switch weapons · R reload · Left click fire · Tab scoreboard
    </div>
  </div>

  <script type="module" src="/game.js"></script>
</body>
</html>
